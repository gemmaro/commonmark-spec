[po_directory] translation/po

[po4a_alias:Spec] CommonMark \
                  opt:"--option yaml_metadata --option skip_code_block" \
                  add_$lang:translation/addendum/credit.$lang.md
[po4a_alias:Readme] CommonMark opt:"--option skip_code_block"

# Spec begin ------------------------------

[type:Spec] translation/tmp/spec.ja.txt \
            ja:translation/build/ja/spec.txt

# Spec end ------------------------------

[type:Readme] README.md \
              $lang:translation/build/$lang/README.md

[type:Xhtml] tools/template.html \
             $lang:translation/build/$lang/tools/template.html
