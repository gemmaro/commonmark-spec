[po_directory] translation/po
[po4a_alias:Markdown] CommonMark opt:"--option skip_code_block"

[type:Markdown] translation/spec.txt \
                $lang:translation/$lang/spec.txt \
                opt:"--option yaml_metadata" \
                add_ja:translation/addendum/credit.ja.md

[type:Markdown] README.md \
                $lang:translation/$lang/README.md

[type:Xhtml] tools/template.html \
             $lang:translation/$lang/tools/template.html
